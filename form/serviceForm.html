<body>
  <div>
    <form>
      <fieldset>
        <legend>Device Repair Form</legend>
        
        <fieldset>
          <p>Our technicians work diligently to diagnose and repair your devices in a timely manner, minimizing any disruption to your daily routine</p>
          <label for="dropdown"> dropdown</label>
            <select id="dropdown">
              <option>Select type of device</option>
              <option>Computer</option>
              <option>Laptop</option>
              <option>Phone</option>
              <option>Tablet</option>
              <option>Bluetooth Speaker</option>
              <option>Other device</option>
            </select>
        </fieldset>
        
        <fieldset>
          <p>What is the name of your device manufacturer</p>
          <label for="frontend"><input type="radio" value="HP" id="frontend" name="manufacturer" class="input-radio" /> HP</label>
          <label for="backend"><input type="radio" value="Apple" id="backend" name="manufacturer" class="input-radio" /> Apple</label>
          <!-- Add other manufacturer options here -->
        </fieldset>
        
        <fieldset>
          <p>Specify the type of service required</p>
          <label for="screen"><input name="prefer" value="Screen Repair" type="checkbox" id="screen" class="input-checkbox" />Screen Repair</label>
          <label for="battery"><input name="prefer" value="Battery Replacement" type="checkbox" id="battery" class="input-checkbox" />Battery Replacement</label>
          <!-- Add other service options here -->
        </fieldset>
        
        <fieldset>
          <p>Any comments or complaints</p>
          <label for="textArea"><textarea id="textArea" class="input-textarea" placeholder="Enter your comments here"></textarea></label>
        </fieldset>
        
        <fieldset>
          <label for="submit"><button id="submit" type="submit">Submit</button></label>
        </fieldset>
        
      </fieldset>
    </form>
  </div>
</body>
